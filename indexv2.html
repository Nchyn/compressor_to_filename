  canvas=new OffscreenCanvas(width,height);const ctx=canvas.getContext('2d');
  if(!ctx)throw Error('无法创建Canvas');ctx.fillStyle=options.background||'#ffffff';ctx.fillRect(0,0,width,height);ctx.imageSmoothingQuality='high';ctx.drawImage(image,0,0,width,height);image.close();image=null;
  const decodeDrawMs=Math.round(performance.now()-start),attempts=[],maxAttempts=4;let chosen=null,low=.5,high=.99,q=fixedQuality?.98:.99;
  for(let i=0;i<maxAttempts;i++){
   stage(`JPEG编码 ${i+1}/${maxAttempts} · 质量参数 ${q.toFixed(3)}`);const t=performance.now();
   const blob=await canvas.convertToBlob({type:'image/jpeg',quality:q});
   if(blob.type!=='image/jpeg')throw Error('浏览器未生成JPEG');
   attempts.push({quality:q,bytes:blob.size,ms:Math.round(performance.now()-t)});
   if(blob.size<targetBytes){if(!chosen||q>chosen.quality)chosen={blob,quality:q};low=q;if(i===0)break;}
   else high=q;
   q=(low+high)/2;
  }
  if(!chosen)throw Error(`4次编码内未达到${targetBytes/1000}KB上限；已降低质量，未自动缩小图片。`);
  postMessage({type:'result',result:{...chosen,targetBytes,width,height,origWidth,origHeight,half,decodeDrawMs,attempts,ms:Math.round(performance.now()-start)}});
 }catch(e){postMessage({type:'error',message:e.message});}
 finally{image?.close();if(canvas)canvas.width=canvas.height=0;}
};
</script>
<script>
(()=>{
// Included inline in the file-openable rail variant; secrets stay in this main-thread closure.
let bridgeConfig={endpoint:'http://127.0.0.1:48731'};
let bridgeConnected=false,bridgePasteQueue=Promise.resolve();
async function bridgeRequest(path,body,type='application/json'){
 if(!bridgeConfig)throw Error('客户端未连接');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path==='/api/health'?3000:90000);
 try{const response=await fetch(bridgeConfig.endpoint+path,{method:'POST',headers:{'Content-Type':type},body:type==='application/json'?JSON.stringify(body):body,signal:controller.signal});const data=await response.json();if(!response.ok)throw Error(data.error||'客户端请求失败');return data;}finally{clearTimeout(timer);}
}
let pairingBusy=false,connectBusy=false,retryAt=0,pairMessage='';
const connectionDot=document.getElementById('clientDot');
function connectionStatus(message){
 connectionDot.style.background=bridgeConnected?'#22c55e':pairingBusy?'#f59e0b':'#aaa';
 connectionDot.title=message+'\n当前地址：'+bridgeConfig.endpoint+'\n候选端口：48731–48735\n点击重新连接；请在客户端保存此压缩器URL。服务退出时，请先重启客户端。';
 connectionDot.setAttribute('aria-label',message);
}
function connectionError(e){
 if(e.name==='AbortError')return '连接超时：请检查客户端运行状态及浏览器本地网络权限';
 if(e instanceof TypeError)return '无法访问客户端：请检查服务是否启动、48731–48735端口及浏览器本地网络权限';
 return e.message||'连接失败';
}
async function bridgeCheck(){
 const endpoints=[bridgeConfig.endpoint,...[48731,48732,48733,48734,48735].map(p=>'http://127.0.0.1:'+p)].filter((v,i,a)=>a.indexOf(v)===i);
 const errors=[];
 for(const endpoint of endpoints){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1200);
  try{
   const response=await fetch(endpoint+'/api/health',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:controller.signal});
   const data=await response.json();
   if(!response.ok)throw Error(data.error||'来源未允许');
   if(data.service!=='local-jpeg-clipboard'||data.version<3)throw Error('端口为旧版或其他服务，请更新客户端');
   bridgeConfig={endpoint};bridgeConnected=true;connectionStatus('客户端已连接');return;
  }catch(e){errors.push(endpoint.split(':').pop()+': '+connectionError(e));}finally{clearTimeout(timer);}
 }
 bridgeConnected=false;connectionStatus('五个端口均未连接\n'+errors.join('\n'));
}
connectionDot.style.cursor='pointer';connectionDot.tabIndex=0;connectionDot.setAttribute('role','button');
connectionDot.onclick=()=>autoConnect(true);
connectionDot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();autoConnect(true);}};
async function autoConnect(manual=false){
 if(connectBusy)return;connectBusy=true;
 try{if(manual)connectionStatus('正在检查客户端连接');await bridgeCheck();}finally{connectBusy=false;}
}
window.addEventListener('focus',()=>autoConnect());
window.addEventListener('online',()=>autoConnect());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoConnect();});
function bridgeEncode(file,onStage){return new Promise((resolve,reject)=>{
 const source=document.getElementById('jpegWorkerSource').textContent,url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
 const worker=new Worker(url);const timer=setTimeout(()=>finish(Error('JPEG编码超时')),180000);
 function finish(error,result){clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);error?reject(error):resolve(result);}
 worker.onmessage=({data})=>{if(data.type==='stage')onStage(data.text);else if(data.type==='error')finish(Error(data.message));else finish(null,data.result);};
 worker.onerror=e=>finish(Error(e.message));
 worker.postMessage({file,options:{preHalf:document.getElementById('bridgeHalf').checked,manualMode:isManualMode(),manualKB:getFallbackKB(),targets:RESOLUTION_TARGETS,defaultKB:PASTE_DEFAULT_KB,background:'#ffffff'}});
});}
async function bridgePaste(blobs){
 for(let i=0;i<blobs.length;i++){
  const file=blobs[i],name=file.name||`剪贴板-${Date.now()}.jpg`;
  const entry=row({localOnly:true,status:'pending',filePath:name,orig:file.size,target:file.size>10000000?20000000:(isManualMode()?getFallbackKB()*1000:null),note:'JPEG编码中'});
  try{
   const r=await bridgeEncode(file,text=>{entry.lastElementChild.textContent=text;});
   const preview=URL.createObjectURL(r.blob);
   row({localOnly:true,rowEl:entry,status:'ok',filePath:name,width:r.width,height:r.height,orig:file.size,target:r.targetBytes,result:r.blob.size,note:`JPEG · Q${r.quality.toFixed(3)} · ${r.ms}ms${r.half?' · 宽高减半':''}`,previewURL:preview,previewName:name});
   const cell=entry.lastElementChild,status=document.createElement('span'),button=document.createElement('button');button.className='btn';button.textContent='复制文件';cell.append(' ',button,' ',status);
   let id=null,busy=false;
   async function copy(){if(busy)return;busy=true;button.disabled=true;try{status.textContent='写入中';if(!id)id=(await bridgeRequest('/api/files',r.blob,'image/jpeg')).fileId;const report=await bridgeRequest('/api/clipboard/file',{fileId:id});if(!report.verified)throw Error('未通过回读校验');status.textContent='已复制';}catch(e){status.textContent=e.message;}finally{busy=false;button.disabled=false;}}
   button.onclick=copy;await copy();
  }catch(e){row({localOnly:true,rowEl:entry,status:'err',filePath:name,orig:file.size,target:20000000,note:e.message});}
 }
}
// Capture before the classic paste handler; folder and ZIP workflows are unchanged.
document.addEventListener('paste',e=>{
 const dt=e.clipboardData;let blobs=Array.from(dt?.files||[]).filter(f=>f.type.startsWith('image/'));
 if(!blobs.length)blobs=Array.from(dt?.items||[]).filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
 if(!blobs.length)return;e.preventDefault();e.stopImmediatePropagation();
 showToast(`已捕获 ${blobs.length} 张图片`);
 bridgePasteQueue=bridgePasteQueue.then(()=>bridgePaste(blobs)).catch(e=>showToast(e.message));
},true);
document.addEventListener('keydown',async e=>{
 if(!e.ctrlKey||e.metaKey||e.code!=='KeyV'||e.repeat)return;e.preventDefault();
 try{const items=await navigator.clipboard.read(),blobs=[];for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type)blobs.push(await item.getType(type));}if(!blobs.length)throw Error('剪贴板没有图片');bridgePasteQueue=bridgePasteQueue.then(()=>bridgePaste(blobs)).catch(e=>showToast(e.message));}catch(err){showToast(err.message);}
},true);
autoConnect();setInterval(autoConnect,15000);

})();
</script>
