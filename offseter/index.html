<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>百度充值信息生成器</title>
  <style>
    :root {
      --color-primary: #1677ff;
      --color-primary-hover: #4096ff;
      --color-primary-active: #0958d9;
      --color-text: rgba(0, 0, 0, 0.88);
      --color-text-secondary: rgba(0, 0, 0, 0.65);
      --color-text-tertiary: rgba(0, 0, 0, 0.45);
      --color-border: #d9d9d9;
      --color-border-secondary: #f0f0f0;
      --color-bg-layout: #f5f5f5;
      --color-bg-container: #ffffff;
      --color-fill-tertiary: rgba(0, 0, 0, 0.04);
      --radius: 6px;
      --font-size: 14px;
      --control-height: 32px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--color-bg-layout);
      color: var(--color-text);
      font-size: var(--font-size);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--color-bg-container);
      border-radius: 8px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
      width: 100%;
      max-width: 560px;
    }
    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border-secondary);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text);
    }
    .card-body {
      padding: 24px;
    }
    .form-item {
      margin-bottom: 20px;
    }
    .form-item:last-child {
      margin-bottom: 0;
    }
    .form-label {
      display: block;
      margin-bottom: 4px;
      color: var(--color-text);
      font-size: var(--font-size);
      line-height: 22px;
    }
    .form-control {
      width: 100%;
      height: var(--control-height);
      padding: 4px 11px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: var(--font-size);
      line-height: 22px;
      color: var(--color-text);
      background: var(--color-bg-container);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }
    .form-control:hover {
      border-color: var(--color-primary-hover);
    }
    .form-control:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);
    }
    .input-affix {
      display: flex;
      align-items: stretch;
      width: 100%;
    }
    .input-affix .form-control {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      flex: 1;
      min-width: 0;
    }
    .input-affix-suffix {
      display: flex;
      align-items: center;
      padding: 0 11px;
      background: var(--color-fill-tertiary);
      border: 1px solid var(--color-border);
      border-left: none;
      border-top-right-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      font-size: var(--font-size);
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .form-hint {
      margin-top: 4px;
      font-size: 12px;
      color: var(--color-text-tertiary);
      line-height: 18px;
    }
    /* 必填校验错误态 */
    .has-error.form-control,
    .has-error .form-control {
      border-color: #ff4d4f;
    }
    .has-error.form-control:hover,
    .has-error .form-control:hover {
      border-color: #ff4d4f;
    }
    .has-error.form-control:focus,
    .has-error .form-control:focus {
      border-color: #ff4d4f;
      box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.06);
    }
    .has-error .input-affix-suffix {
      border-color: #ff4d4f;
    }
    .error-msg {
      margin-top: 4px;
      font-size: 12px;
      line-height: 18px;
      color: #ff4d4f;
    }
    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-row .form-item {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }
    /* 下拉选择（Select 风格） */
    .select-wrap {
      position: relative;
    }
    .select-wrap .form-control {
      padding-right: 36px;
    }
    .select-arrow {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
    }
    .select-arrow:hover {
      color: var(--color-text-secondary);
    }
    .select-wrap.open .select-arrow {
      transform: rotate(180deg);
    }
    .select-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
      padding: 4px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 20;
    }
    .select-dropdown.show {
      display: block;
    }
    .dropdown-item {
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 22px;
      color: var(--color-text);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dropdown-item:hover {
      background: rgba(0, 0, 0, 0.04);
    }
    .dropdown-empty {
      padding: 8px 12px;
      font-size: 14px;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .preview {
      margin-top: 24px;
      padding: 12px 16px;
      background: #fafafa;
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--radius);
      font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.9;
      color: var(--color-text);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .btn-primary {
      width: 100%;
      height: 40px;
      margin-top: 24px;
      border: none;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
    }
    .btn-primary:active {
      background: var(--color-primary-active);
    }
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 9px 12px;
      border-radius: var(--radius);
      font-size: var(--font-size);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 999;
      max-width: 80%;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">百度充值信息生成器</div>
    <div class="card-body">
      <div class="form-item">
        <label class="form-label" for="account">充值账户名称</label>
        <div class="select-wrap" id="accountSelectWrap">
          <input class="form-control" type="text" id="account" autocomplete="off" placeholder="请选择或输入充值账户名称" />
          <div class="select-arrow" id="accountArrow">
            <svg viewBox="0 0 1024 1024" width="12" height="12" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z" /></svg>
          </div>
          <div class="select-dropdown" id="accountDropdown"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-item">
          <label class="form-label" for="amount">回款金额</label>
          <input class="form-control" type="number" id="amount" min="0" step="any" placeholder="如 20000" />
        </div>
        <div class="form-item">
          <label class="form-label" for="ratio">比例</label>
          <div class="input-affix">
            <input class="form-control" type="number" id="ratio" min="0" step="any" placeholder="如 35" />
            <span class="input-affix-suffix">%</span>
          </div>
        </div>
      </div>
      <div class="form-hint" style="margin: -12px 0 20px">充值账显金额 = 回款金额 ×（1 + 比例）</div>

      <div class="form-item">
        <label class="form-label" for="contract">媒体合同号</label>
        <div class="select-wrap" id="contractSelectWrap">
          <input class="form-control" type="text" id="contract" value="B26KA21876" autocomplete="off" />
          <div class="select-arrow" id="contractArrow">
            <svg viewBox="0 0 1024 1024" width="12" height="12" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z" /></svg>
          </div>
          <div class="select-dropdown" id="contractDropdown"></div>
        </div>
      </div>

      <div class="form-item">
        <label class="form-label" for="docNo">关联单据编号</label>
        <input class="form-control" type="text" id="docNo" placeholder="请输入关联单据编号" />
      </div>

      <div class="preview" id="preview"></div>

      <button class="btn-primary" id="copyBtn">复制到剪切板</button>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪切板</div>

  <script>
    const accountInput = document.getElementById('account');
    const accountArrow = document.getElementById('accountArrow');
    const accountDropdown = document.getElementById('accountDropdown');
    const amountInput = document.getElementById('amount');
    const ratioInput = document.getElementById('ratio');
    const contractInput = document.getElementById('contract');
    const contractArrow = document.getElementById('contractArrow');
    const contractDropdown = document.getElementById('contractDropdown');
    const docNoInput = document.getElementById('docNo');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    const HISTORY_KEYS = {
      account: 'baidu_recharge_history_account',
      contract: 'baidu_recharge_history_contract',
    };
    const HISTORY_MAX = 10;

    // ---------- 历史记录（localStorage） ----------
    function getHistory(key) {
      try {
        const list = JSON.parse(localStorage.getItem(key));
        return Array.isArray(list) ? list : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(key, value) {
      const v = (value || '').trim();
      if (!v) return;
      const list = getHistory(key).filter((x) => x !== v);
      list.unshift(v);
      localStorage.setItem(key, JSON.stringify(list.slice(0, HISTORY_MAX)));
    }

    // ---------- 下拉历史选择（Select 风格，通用） ----------
    function initDropdown(inputEl, arrowEl, dropdownEl, historyKey) {
      function render() {
        const list = getHistory(historyKey);
        dropdownEl.innerHTML = '';
        if (!list.length) {
          const empty = document.createElement('div');
          empty.className = 'dropdown-empty';
          empty.textContent = '暂无历史记录';
          dropdownEl.appendChild(empty);
          return;
        }
        list.forEach((v) => {
          const item = document.createElement('div');
          item.className = 'dropdown-item';
          item.textContent = v;
          item.title = v;
          // 阻止 mousedown 触发输入框 blur，避免下拉先被关闭
          item.addEventListener('mousedown', (e) => e.preventDefault());
          item.addEventListener('click', () => {
            inputEl.value = v;
            saveHistory(historyKey, v); // 选中项上浮到最前
            render();
            close();
            updatePreview();
            clearFieldError(inputEl);
          });
          dropdownEl.appendChild(item);
        });
      }

      function close() {
        dropdownEl.classList.remove('show');
        arrowEl.parentElement.classList.remove('open');
      }

      arrowEl.addEventListener('click', (e) => {
        e.stopPropagation();
        render();
        const show = dropdownEl.classList.toggle('show');
        arrowEl.parentElement.classList.toggle('open', show);
      });

      // 点击页面其他区域关闭下拉
      document.addEventListener('click', (e) => {
        if (!arrowEl.parentElement.contains(e.target)) close();
      });

      inputEl.addEventListener('blur', () => {
        saveHistory(historyKey, inputEl.value);
        render();
        setTimeout(close, 150);
      });

      return { render, close };
    }

    const accountDropdownCtl = initDropdown(accountInput, accountArrow, accountDropdown, HISTORY_KEYS.account);
    const contractDropdownCtl = initDropdown(contractInput, contractArrow, contractDropdown, HISTORY_KEYS.contract);

    // 首次使用时预置默认媒体合同号到历史记录
    if (!getHistory(HISTORY_KEYS.contract).length) {
      saveHistory(HISTORY_KEYS.contract, 'B26KA21876');
      contractDropdownCtl.render();
    }

    // ---------- 必填校验 ----------
    const requiredFields = [
      { el: accountInput, label: '充值账户名称' },
      { el: amountInput, label: '回款金额' },
      { el: ratioInput, label: '比例' },
      { el: contractInput, label: '媒体合同号' },
      { el: docNoInput, label: '关联单据编号' },
    ];

    function getControl(el) {
      return el.closest('.input-affix') || el;
    }

    function clearFieldError(el) {
      getControl(el).classList.remove('has-error');
      const item = el.closest('.form-item');
      const msg = item.querySelector('.error-msg');
      if (msg) msg.remove();
    }

    function showFieldError(el, text) {
      const item = el.closest('.form-item');
      let msg = item.querySelector('.error-msg');
      if (!msg) {
        msg = document.createElement('div');
        msg.className = 'error-msg';
        item.appendChild(msg);
      }
      msg.textContent = text;
    }

    function validate() {
      let firstInvalid = null;
      requiredFields.forEach(({ el, label }) => {
        const value = (el.value || '').trim();
        if (!value) {
          getControl(el).classList.add('has-error');
          showFieldError(el, `请输入${label}`);
          if (!firstInvalid) firstInvalid = el;
        } else {
          clearFieldError(el);
        }
      });
      return firstInvalid;
    }

    // ---------- 输出 ----------
    function formatNumber(num) {
      if (Number.isInteger(num)) return String(num);
      return String(Math.round(num * 100) / 100);
    }

    function buildText() {
      const amount = parseFloat(amountInput.value) || 0;
      const ratio = parseFloat(ratioInput.value) || 0;
      const displayAmount = formatNumber(amount * (1 + ratio / 100));
      const account = accountInput.value.trim();
      const contract = contractInput.value.trim();
      const docNo = docNoInput.value.trim();

      return [
        `充值账户名称：${account}`,
        `充值账显金额：${displayAmount}`,
        '期望充值日期：',
        `媒体合同号：${contract}`,
        '充值方式：临时垫付单',
        `关联单据编号：${docNo}`,
        '百度充值 @小致(小致）',
      ].join('\n');
    }

    function updatePreview() {
      preview.textContent = buildText();
    }

    requiredFields.forEach(({ el }) => {
      el.addEventListener('input', () => {
        if ((el.value || '').trim()) clearFieldError(el);
        updatePreview();
      });
    });
    updatePreview();

    // ---------- 复制 ----------
    copyBtn.addEventListener('click', async () => {
      const invalidEl = validate();
      if (invalidEl) {
        invalidEl.focus();
        showToast('请填写必填内容');
        return;
      }
      // 复制前保存当前值到历史
      saveHistory(HISTORY_KEYS.account, accountInput.value);
      saveHistory(HISTORY_KEYS.contract, contractInput.value);
      accountDropdownCtl.render();
      contractDropdownCtl.render();

      const text = buildText();
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      showToast('已复制到剪切板');
    });

    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    accountDropdownCtl.render();
    contractDropdownCtl.render();
  </script>
</body>
</html>
