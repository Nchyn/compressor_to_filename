[package]
name = "jpeg-clipboard-windows"
version = "5.4.0"
edition = "2021"
publish = false

[dependencies]
tiny_http = "0.12"
serde_json = "1"
url = "2"
sha2 = "0.10"
getrandom = "0.2"
# Only central-directory metadata is read; payloads are never decompressed or repacked.
zip = { version = "2", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
